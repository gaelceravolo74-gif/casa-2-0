<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">

<style>

</style>

<body>
<canvas id="reel" width="1080" height="1920" role="img" aria-label="Casa 2.0 — Vendi casa a Tivoli? Conosciamo ogni pietra. Ogni casa ha la sua storia, e il suo giusto prezzo. Il metodo Casa 2.0: valutazioni oneste, ti guidiamo fino al rogito, marketing trasparente. Non vendiamo solo mura, custodiamo sogni. Valutazione gratuita in 24 ore — casaduepuntozero.net"></canvas>
<button id="play" class="sr-only" type="button">Guarda il video con l'audio</button>
<script>
(() => {
"use strict";

/* =====================================================================
   CASA 2.0 — "Tivoli, pixel per pixel"  ·  reel verticale 9:16, 30 s
   230.400 pixel (360 × 640) disegnati e animati interamente in codice:
   scene procedurali, particelle, testo e colonna sonora Web Audio.
   Copy e palette dal sito casaduepuntozero.net.
   ===================================================================== */

// ------------------------------------------------------------------ math
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const sstep = (a, b, v) => smooth(inv(a, b, v));
const E = {
  outCubic: t => 1 - (1 - t) ** 3,                   // ≈ cubic-bezier(.215,.61,.355,1)
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (a, b = 0) => {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

// Perlin gradient noise + fBm
function Noise(seed) {
  const r = rng(seed), perm = new Uint8Array(256), p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) perm[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0, s = perm[i]; perm[i] = perm[j]; perm[j] = s; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  function n2(x, y) {
    const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
    const u = fade(xf), v = fade(yf);
    const aa = p[p[xi] + yi], ab = p[p[xi] + yi + 1], ba = p[p[xi + 1] + yi], bb = p[p[xi + 1] + yi + 1];
    return lerp(lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u), lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u), v) * 0.72;
  }
  function fbm(x, y, oct = 5) {
    let a = 0.5, f = 1, s = 0, n = 0;
    for (let i = 0; i < oct; i++) { s += a * n2(x * f, y * f); n += a; a *= 0.5; f *= 2.03; }
    return s / n;
  }
  return { n2, fbm };
}

// ---------------------------------------------------------------- colour
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const COL = {
  ink: hex('#0E1116'), navy: hex('#1A2A3C'), teal: hex('#326273'), tealL: hex('#4A8FA3'), glow: hex('#8EC5D6'),
  paper: hex('#FAF7F4'), coral: hex('#E8674F'), coralL: hex('#FF7E6B'), red: hex('#C0392B'),
};
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const pack = (r, g, b) => (0xFF000000 | ((b < 0 ? 0 : b > 255 ? 255 : b) << 16) | ((g < 0 ? 0 : g > 255 ? 255 : g) << 8) | (r < 0 ? 0 : r > 255 ? 255 : r)) >>> 0;
const BG = pack(14, 17, 22);

// ------------------------------------------------------- the pixel canvas
const GW = 360, GH = 640, N = GW * GH;        // 230.400 pixel
const PX = 3, OW = GW * PX, OH = GH * PX;     // 1080 × 1920
const DU = 1000 / GW;                         // design units per pixel (the frame is 1000 × 1777.8 units)
const DH = GH * DU;
const cvs = document.getElementById('reel');
const ctx = cvs.getContext('2d', { alpha: false });
const pix = document.createElement('canvas'); pix.width = GW; pix.height = GH;
const pctx = pix.getContext('2d');
const frameImg = pctx.createImageData(GW, GH);
const buf = new Uint32Array(frameImg.data.buffer);
const CXA = new Uint16Array(N), CYA = new Uint16Array(N);    // cell → x, y
for (let i = 0; i < N; i++) { CXA[i] = i % GW; CYA[i] = (i / GW) | 0; }
const blm = document.createElement('canvas'); blm.width = GW / 4; blm.height = GH / 4;
const bctx = blm.getContext('2d');

const FONT_SERIF = '"Zodiak", "Iowan Old Style", "Charter", "Bitstream Charter", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif';
const FONT_SANS = '"Satoshi", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';

// a painter works in design units on a 360 × 640 canvas
function painter() {
  const c = document.createElement('canvas'); c.width = GW; c.height = GH;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.setTransform(GW / 1000, 0, 0, GW / 1000, 0, 0);
  return { c, g };
}
function pass(pt, fn) {                        // per-pixel shader over a painter
  const id = pt.g.getImageData(0, 0, GW, GH), d = id.data;
  for (let py = 0, i = 0; py < GH; py++) {
    const y = (py + 0.5) * DU;
    for (let px = 0; px < GW; px++, i += 4) fn(d, i, (px + 0.5) * DU, y, px, py);
  }
  pt.g.putImageData(id, 0, 0);
}
function mask(draw) {                          // coverage mask (0–255) of a shape
  const m = painter(); m.g.fillStyle = '#fff'; m.g.strokeStyle = '#fff';
  draw(m.g);
  const d = m.g.getImageData(0, 0, GW, GH).data, out = new Uint8Array(N);
  for (let i = 0; i < N; i++) out[i] = d[i * 4 + 3];
  return out;
}
function toU32(pt) {
  const d = pt.g.getImageData(0, 0, GW, GH).data, out = new Uint32Array(N);
  for (let i = 0; i < N; i++) out[i] = pack(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
  return out;
}
function glowDisc(g, x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, css(col, a)); gr.addColorStop(0.35, css(col, a * 0.35)); gr.addColorStop(1, css(col, 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function ridge(g, y0, amp, freq, seed, top, bottom, depth = 260) {
  const n = Noise(seed);
  g.beginPath(); g.moveTo(-10, DH + 10);
  for (let x = -10; x <= 1010; x += 4) g.lineTo(x, y0 - amp * (0.5 + n.fbm(x * freq, 0.37, 4)));
  g.lineTo(1010, DH + 10); g.closePath();
  const lg = g.createLinearGradient(0, y0 - amp, 0, y0 + depth);
  lg.addColorStop(0, top); lg.addColorStop(1, bottom);
  g.fillStyle = lg; g.fill();
}

// =====================================================================
//  PAINTING HELPERS
// =====================================================================
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function region(pt, x0, y0, x1, y1, fn) {      // per-pixel shader over a design-unit box
  const px0 = Math.max(0, Math.floor(x0 / DU)), px1 = Math.min(GW - 1, Math.ceil(x1 / DU));
  const py0 = Math.max(0, Math.floor(y0 / DU)), py1 = Math.min(GH - 1, Math.ceil(y1 / DU));
  if (px1 < px0 || py1 < py0) return;
  const w = px1 - px0 + 1, h = py1 - py0 + 1, id = pt.g.getImageData(px0, py0, w, h), d = id.data;
  for (let py = 0, i = 0; py < h; py++) {
    const y = (py0 + py + 0.5) * DU;
    for (let px = 0; px < w; px++, i += 4) fn(d, i, (px0 + px + 0.5) * DU, y, px0 + px, py0 + py);
  }
  pt.g.putImageData(id, px0, py0);
}
const mixIn = (d, i, r, g, b, a) => { if (a <= 0) return; if (a > 1) a = 1; d[i] += (r - d[i]) * a; d[i + 1] += (g - d[i + 1]) * a; d[i + 2] += (b - d[i + 2]) * a; };
function grade(pt, fn) {                          // final colour grade + dither (kills banding)
  const r = rng(77);
  pass(pt, (d, i, x, y) => { fn && fn(d, i, x, y); const n = (r() - 0.5) * 5; d[i] += n; d[i + 1] += n; d[i + 2] += n; });
}
function indexList(m, thr = 8) { const out = []; for (let i = 0; i < N; i++) if (m[i] > thr) out.push(i); return Int32Array.from(out); }

// =====================================================================
//  SCENE 1 — TIVOLI: il Tempio di Vesta sulla rupe, la cascata, il tramonto
// =====================================================================
function edges(m) {                               // per row: first / last covered pixel of a mask
  const L = new Int16Array(GH).fill(-1), R = new Int16Array(GH).fill(-1);
  for (let py = 0; py < GH; py++) for (let px = 0; px < GW; px++) if (m[py * GW + px] > 127) { if (L[py] < 0) L[py] = px; R[py] = px; }
  return { L, R };
}
function paintTemple() {
  const P = painter(), g = P.g, nA = Noise(11), nB = Noise(12), nC = Noise(13), nD = Noise(14);
  const SX = 175, SY = 992;                                          // the sun sets on the left
  // sky
  const sky = g.createLinearGradient(0, 0, 0, 1090);
  [[0, '#101830'], [0.25, '#212f57'], [0.48, '#4d4b78'], [0.67, '#9c6670'], [0.81, '#d98c5e'], [0.93, '#f2b872'], [1, '#f7cf92']].forEach(([o, c]) => sky.addColorStop(o, c));
  g.fillStyle = sky; g.fillRect(0, 0, 1000, DH);
  const side = g.createLinearGradient(0, 0, 1000, 0);                // the sky darkens away from the sun
  side.addColorStop(0, 'rgba(255,170,110,0.16)'); side.addColorStop(0.6, 'rgba(40,40,90,0)'); side.addColorStop(1, 'rgba(18,22,52,0.22)');
  g.fillStyle = side; g.fillRect(0, 0, 1000, 1100);
  glowDisc(g, SX, SY, 620, [255, 190, 120], 0.5);
  glowDisc(g, SX, SY, 190, [255, 228, 170], 0.9);
  g.fillStyle = '#fff6df'; g.beginPath(); g.arc(SX, SY, 28, 0, TAU); g.fill();
  // clouds: long cirrus, lit from below by the low sun
  pass(P, (d, i, x, y) => {
    if (y > 970) return;
    const band = Math.exp(-(((y - 390) / 85) ** 2)) + 0.85 * Math.exp(-(((y - 625) / 52) ** 2)) + 0.65 * Math.exp(-(((y - 800) / 30) ** 2));
    if (band < 0.03) return;
    const n = nA.fbm(x * 0.0028 + 3.1, y * 0.0135, 6);
    const a = sstep(-0.02, 0.3, n) * Math.min(1, band);
    if (a < 0.01) return;
    const sun = clamp(1 - Math.hypot(x - SX, (y - SY) * 1.5) / 1050);
    const lift = sstep(-0.15, 0.3, nB.fbm(x * 0.006, y * 0.03 + 7, 3));
    mixIn(d, i, lerp(92, 255, sun) + lift * 22, lerp(82, 176, sun) + lift * 12, lerp(122, 126, sun), a * 0.82);
  });
  // distant hills of the Campagna, in haze
  ridge(g, 1014, 78, 0.0034, 21, '#a27a84', '#6f5a70', 200);
  ridge(g, 1054, 70, 0.0062, 22, '#5f4b66', '#382e45', 240);
  const hz = g.createLinearGradient(0, 930, 0, 1150);
  hz.addColorStop(0, 'rgba(255,190,125,0)'); hz.addColorStop(0.35, 'rgba(255,186,120,0.26)'); hz.addColorStop(1, 'rgba(255,186,120,0)');
  g.fillStyle = hz; g.fillRect(0, 930, 1000, 220);
  // the gorge: deep, shadowed woods
  pass(P, (d, i, x, y) => {
    if (y < 1086) return;
    const leaf = 0.55 + nB.fbm(x * 0.03, y * 0.03, 4) * 0.8, depth = sstep(1100, 1500, y);
    mixIn(d, i, lerp(46, 18, depth) * leaf, lerp(52, 30, depth) * leaf, lerp(58, 30, depth) * leaf, 1);
  });
  // two rock masses: the town's cliff (left, with the fall) and the acropolis (right)
  const LEFT = [[-10, 1080], [70, 1072], [150, 1082], [214, 1094], [262, 1100], [310, 1108], [344, 1146], [366, 1236], [358, 1330], [382, 1440], [366, 1560], [396, 1790], [-10, 1790]];
  const ACRO = [[1010, 1022], [880, 1018], [700, 1022], [520, 1024], [482, 1036], [462, 1084], [450, 1172], [468, 1262], [444, 1350], [458, 1442], [436, 1532], [452, 1642], [436, 1790], [1010, 1790]];
  const mL = mask(m => { poly(m, LEFT); m.fill(); }), mR = mask(m => { poly(m, ACRO); m.fill(); });
  const eL = edges(mL), eR = edges(mR);
  const Lx = -0.86, Ly = -0.4, Lz = 0.22;                          // towards the sun: low, on the left
  pass(P, (d, i, x, y, px, py) => {
    const k = py * GW + px, aL = mL[k] / 255, aR = mR[k] / 255, a = Math.max(aL, aR);
    if (a <= 0) return;
    const right = aR >= aL;
    // height field → normal (relief lighting)
    const h = (u, v) => nC.fbm(u * 0.0062, v * 0.0034, 5) + 0.3 * Math.abs(nD.n2(u * 0.016, v * 0.0045));
    const e = 3, hx = (h(x + e, y) - h(x - e, y)) / (2 * e), hy = (h(x, y + e) - h(x, y - e)) / (2 * e);
    let nx = -hx * 230, ny = -hy * 120, nz = 1;
    // macro orientation: the acropolis wall faces the gorge (and the sun); the town cliff turns away
    if (right) nx -= 1.1 * Math.exp(-(px - eR.L[py]) / 26);
    else nx += 1.1 * Math.exp(-(eL.R[py] - px) / 26);
    const nl = Math.hypot(nx, ny, nz);
    let diff = Math.max(0, (nx * Lx + ny * Ly + nz * Lz) / nl);
    diff *= 1 - 0.55 * sstep(1080, 1700, y);                         // the sun only grazes the upper rock
    const crack = sstep(0.07, 0.0, Math.abs(nD.n2(x * 0.045, y * 0.0032) + nA.n2(x * 0.01, y * 0.01) * 0.2)) * 0.45;
    const bed = Math.sin(y * 0.07 + nC.n2(x * 0.004, y * 0.01) * 5) * 0.06;
    const tone = 0.82 + nA.fbm(x * 0.06, y * 0.04, 3) * 0.3 + bed - crack;
    let r = (lerp(34, 232, diff) + 12) * tone, gg = (lerp(29, 150, diff) + 8) * tone, b = (lerp(44, 92, diff) + 16) * tone;
    // holm oaks and ivy on the ledges
    const veg = nB.fbm(x * 0.017 + 11, y * 0.021, 4) + sstep(1330, 1760, y) * 0.26;
    if (veg > 0.12) {
      const v = sstep(0.12, 0.28, veg), leaf = 0.55 + nA.n2(x * 0.16, y * 0.16) * 0.45;
      r = lerp(r, lerp(16, 124, diff * leaf), v); gg = lerp(gg, lerp(24, 118, diff * leaf), v); b = lerp(b, lerp(22, 52, diff * leaf), v);
    }
    mixIn(d, i, r, gg, b, a);
  });

  // the edge of the town on the left cliff: houses in shadow, windows lighting up
  const rh = rng(61);
  for (let x = 170, k = 0; x < 350; k++) {
    const w = 34 + rh() * 40, h = 40 + rh() * 60, base = 1090 + (x - 170) * 0.08;
    const wall = rh() < 0.5 ? '#3f303c' : '#483740';
    g.fillStyle = wall; g.fillRect(x, base - h, w, h + 6);
    g.fillStyle = 'rgba(255,170,110,0.22)'; g.fillRect(x, base - h, 3, h);          // sun-side rim
    g.fillStyle = '#35211f'; g.beginPath(); g.moveTo(x - 4, base - h); g.lineTo(x + w / 2, base - h - 12); g.lineTo(x + w + 4, base - h); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,184,100,0.95)';
    for (let wy = base - h + 12; wy < base - 12; wy += 20) for (let wx = x + 7; wx < x + w - 8; wx += 14) if (rh() < 0.3) g.fillRect(wx, wy, 5, 7);
    x += w + 2;
  }

  // ---- il tempio rotondo (Tempio di Vesta / della Sibilla)
  const TX = 714, TR = 168, LA = -52 * Math.PI / 180;               // light from the left
  const th = x => Math.asin(clamp((x - TX) / TR, -1, 1));
  const stone = (lit, lum = 1) => [lerp(84, 246, lit) * lum, lerp(70, 196, lit) * lum, lerp(84, 140, lit) * lum];
  region(P, TX - TR - 20, 976, TX + TR + 20, 1034, (d, i, x, y) => {  // podium
    const u = (x - TX) / (TR + 16); if (Math.abs(u) > 1) return;
    const t = Math.asin(u), yTop = 986 - 6 * Math.cos(t), yBot = 1024 - 4 * Math.cos(t);
    if (y < yTop || y > yBot) return;
    const lit = 0.1 + 0.9 * Math.max(0, Math.cos(t - LA));
    const joint = (Math.abs(((y - yTop) / (yBot - yTop)) - 0.5) < 0.06 || Math.abs(Math.sin(t * 22)) < 0.12) ? 0.8 : 1;
    const [r, gg, b] = stone(lit, (0.9 + nA.n2(x * 0.08, y * 0.08) * 0.12) * joint);
    mixIn(d, i, r, gg, b, 1);
  });
  region(P, TX - 124, 800, TX + 124, 990, (d, i, x, y) => {         // cella in opus reticulatum
    const u = (x - TX) / 120; if (Math.abs(u) > 1) return;
    const t = Math.asin(u);
    if (y < 812 - 10 * Math.cos(t) || y > 988 - 6 * Math.cos(t)) return;
    const lit = 0.06 + 0.62 * Math.max(0, Math.cos(t - LA));
    const net = Math.abs(Math.sin((x + y) * 0.2)) * Math.abs(Math.sin((x - y) * 0.2));
    const [r, gg, b] = stone(lit, 0.76 + net * 0.14 + nB.n2(x * 0.07, y * 0.07) * 0.1);
    mixIn(d, i, r * 0.92, gg * 0.9, b * 0.96, 1);
  });
  g.fillStyle = '#211a1a';
  g.beginPath(); g.moveTo(TX + 12, 990); g.lineTo(TX + 12, 905); g.arc(TX + 35, 905, 23, Math.PI, 0); g.lineTo(TX + 58, 990); g.closePath(); g.fill();
  g.fillRect(TX + 62, 872, 18, 32);
  // 18 columns around the ring; the front half stands on the gorge side, the rest is ruin
  const cols = [];
  for (let k = 0; k < 9; k++) {
    const deg = -80 + k * 20;
    if (deg === 80) continue;
    cols.push({ t: deg * Math.PI / 180, broken: deg === 60 ? 0.42 : deg === 40 ? 0.86 : 1 });
  }
  cols.sort((a, b) => Math.abs(b.t) - Math.abs(a.t));
  for (const c of cols) {
    const xc = TX + TR * Math.sin(c.t), yBase = 984 - 6 * Math.cos(c.t), yCap = 814 - 12 * Math.cos(c.t);
    const yTop = lerp(yBase, yCap, c.broken), hw = 13;
    region(P, xc - hw - 6, yCap - 26, xc + hw + 6, yBase + 4, (d, i, x, y) => {
      let u = (x - xc) / hw;
      if (y >= yTop && y <= yBase - 8 && Math.abs(u) <= 1) {
        const diff = Math.max(0, Math.cos(c.t + Math.asin(u) - LA));
        const flute = 0.86 + 0.14 * Math.cos(u * Math.PI * 5);
        const ao = 0.72 + 0.28 * sstep(yCap, yCap + 40, y);
        const [r, gg, b] = stone(0.1 + 0.9 * diff, flute * ao * (0.94 + nC.n2(x * 0.1, y * 0.05) * 0.1));
        mixIn(d, i, r, gg, b, clamp((1 - Math.abs(u)) * hw / DU * 1.4));
      }
      u = (x - xc) / (hw + 4);
      if (y > yBase - 9 && y <= yBase && Math.abs(u) <= 1) {
        const diff = Math.max(0, Math.cos(c.t + Math.asin(u) - LA));
        const [r, gg, b] = stone(0.16 + 0.84 * diff, 0.95);
        mixIn(d, i, r, gg, b, 1);
      }
