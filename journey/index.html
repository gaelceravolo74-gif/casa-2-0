// =====================================================================
//  CAMERA — a single continuous move through nested spaces:
//  world (the street) → desk (inside the door) → city map → ribbon
// =====================================================================
const DOOR = [0, 420], ZP = 8.5;                 // portal point & scale of the desk inside the door
const SH = [720, 700], ZC = 0.2, ZT = 0.44;       // house on screen at map scale; ribbon zoom
let MID = [-1180, 1550];                         // path midpoint (desk units), set when the path is built
function focal(pt, s0, s1, z0, z1, us, uz) {     // keep `pt` gliding from screen s0 to s1 while zooming
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), uz));
  const sx = lerp(s0[0], s1[0], us), sy = lerp(s0[1], s1[1], us);
  return { x: pt[0] - (sx - CX) / z, y: pt[1] - (sy - CY) / z, z };
}
function worldCam(t) {
  if (t < T.push0) { const u = ep(0, T.push0, t, E.inOutSine); return { x: 0, y: lerp(-45, -15, u), z: 1 + 0.05 * u }; }
  if (t < T.push1) {
    const z0 = 1.05, s0 = [(DOOR[0] - 0) * z0 + CX, (DOOR[1] + 15) * z0 + CY], u = inv(T.push0, T.push1, t);
    return focal(DOOR, s0, [CX, CY], z0, ZP, E.inOutCubic(u), E.inOutCubic(u));
  }
  const d = deskCam(t);
  return { x: DOOR[0] + d.x / ZP, y: DOOR[1] + d.y / ZP, z: d.z * ZP };
}
function deskCam(t) {
  if (t < T.push1) { const w = worldCam(t); return { x: ZP * (w.x - DOOR[0]), y: ZP * (w.y - DOOR[1]), z: w.z / ZP }; }
  if (t < T.fold0) { const u = ep(T.push1, T.fold0, t, E.inOutSine); return { x: 0, y: 12 * u, z: 1 + 0.03 * u }; }
  if (t < T.zoom0) { const u = ep(T.fold0, T.zoom0, t, E.inOutSine); return { x: 0, y: 12 * (1 - u), z: 1.03 - 0.03 * u }; }
  if (t < T.zoom1) { const u = E.inOutCubic(inv(T.zoom0, T.zoom1, t)); return focal([0, 0], [CX, CY], SH, 1, ZC, u, u); }
  if (t < T.thick0) return focal([0, 0], SH, SH, ZC, ZC * 1.04, 0, ep(T.zoom1, T.thick0, t, E.inOutSine));
  const z0 = ZC * 1.04, c0 = focal([0, 0], SH, SH, ZC, z0, 0, 1);
  const sM = [(MID[0] - c0.x) * z0 + CX, (MID[1] - c0.y) * z0 + CY];
  const u = ep(T.thick0, T.thick1, Math.min(t, T.thick1), E.inOutCubic);
  return focal(MID, sM, [CX, CY], z0, ZT, u, u);
}
