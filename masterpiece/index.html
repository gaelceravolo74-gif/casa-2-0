(() => {
"use strict";

/* ==========================================================================
   THE CASA 2.0 SOCIAL MEDIA MASTERPIECE — 40 s, 9:16, one continuous shot
   Plain Canvas 2D + Web Audio. No images, fonts, libraries or network:
   every glyph, shape, transition and sound is generated by this file.

   STRATEGY (Italian, for owners in Tivoli and around it)
   · Hook 0–3.6 s — audience call-out + curiosity gap: "Hai casa a Tivoli?
     Sai quanto vale davvero?" over a blueprint house that turns out to be a
     price tag; the price spins and never resolves (an open loop).
   · Problem 3.6–9.6 s — the #1 fear, taken from the site's own promise
     ("Niente stime gonfiate"): every promise pumps the tag like a balloon,
     it pops, and a year of price cuts drops below the real value. Rewind.
   · Pattern interrupt 9.6 s — "Noi no." Paper floods in, key changes to major.
   · Method 9.6–24 s — the three pillars of the Metodo Casa 2.0, one hand-off
     after another: real Tivoli data → the right price from day one; staging,
     photos, mortgage, notary, compliance done for you; the best portals and
     constant reports → "Venduto. Al prezzo giusto. Senza stress."
   · Proof 25–31 s — the temple of Vesta and the old town (the site's hero
     photo), 30+ years, 24 h, 0 € upfront; then Via Colsereno 45 and the office
     itself: cobalt wall, white logo, pine floor (assets/casa-ufficio.jpg).
   · Offer 31–40 s — the open loop closes: "Quanto vale la tua casa?" — the
     reels land on GRATIS; valuation in 24 h, no obligation, WhatsApp button,
     number and site; the tag morphs into the Casa 2.0 roof, the name writes.
   No hard cuts: every scene hands its shape to the next (house = price tag =
   balloon = chart; tag → house → window → room → photo → phone → house →
   Tivoli → shopfront → office → cobalt wall → tag → logo). The last frame
   (logo on cobalt) and the first (blueprint on cobalt) share a stage, so the
   film loops cleanly on the feed. Captions stay clear of TikTok/Reels UI.

   SOUND — 100 BPM, B minor → D major, scored on the same cue table T as the
   picture: slams, pen scratch, reel ticks, pump and rubber squeak, pop,
   clock, tape rewind, marimba data points, stamps, shutter, paper, pings,
   keys, shop bell, and a four-note motif that returns on SOLD and the logo.

   EXPORT — "Scarica il video" on the poster records in real time. For the
   frame-exact 60 fps MP4 (H.264 + AAC) run node masterpiece/export-mp4.js:
   it renders every frame and the score offline through the hooks at the end.
   ========================================================================== */

// =============================================================== utilities
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const sm = t => t * t * (3 - 2 * t);
const ss = (a, b, v) => sm(inv(a, b, v));
const win = (t, a, b, c, d) => ss(a, b, t) * (1 - ss(c, d, t));
const E = {
  lin: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inCubic: t => t * t * t,
  inQuart: t => t * t * t * t,
  outCubic: t => 1 - (1 - t) ** 3,
  outQuart: t => 1 - (1 - t) ** 4,
  outQuint: t => 1 - (1 - t) ** 5,
  outExpo: t => (t >= 1 ? 1 : 1 - 2 ** (-10 * t)),
  inExpo: t => (t <= 0 ? 0 : 2 ** (10 * t - 10)),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
  inOutQuart: t => (t < 0.5 ? 8 * t ** 4 : 1 - (-2 * t + 2) ** 4 / 2),
  inOutQuint: t => (t < 0.5 ? 16 * t ** 5 : 1 - (-2 * t + 2) ** 5 / 2),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  inOutExpo: t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? 2 ** (20 * t - 10) / 2 : (2 - 2 ** (-20 * t + 10)) / 2),
  outBack: t => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
  outBackS: t => 1 + 2.2 * (t - 1) ** 3 + 1.2 * (t - 1) ** 2,
  inBack: t => 2.70158 * t ** 3 - 1.70158 * t * t,
  outElastic: t => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),

// eased progress of the window [a, b]
const ep = (a, b, t, f = E.inOutCubic) => f(inv(a, b, t));
// damped spring response to a step at time 0 (0 → 1 with overshoot)
const spring = (t, f = 7, z = 0.42) => {
  if (t <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
};
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (a, b = 0) => {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
// smooth 1D value noise in [-1, 1]
const noise1 = x => {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i, 17) * 2 - 1, hash(i + 1, 17) * 2 - 1, u);
};

// ================================================================= palette
// Casa 2.0 identity, measured from the real assets:
//  · logo.png — roof cerulean #0B8BBE, lettering navy #142552
//  · casa-ufficio.jpg — cobalt feature wall #255892, pine floor, white panels
//  · site.css (live) — paper #F7F1EB, beige #EFE4DA, sky #EAF4F9, navy #2C4F66,
//    ink #233F52, primary #2B789C / #5AAFD3, accent-on-dark #9ED3EA.
//    Red is deliberately absent: the site retired it as off-brand.
const C = {
  roof:     [11, 139, 190],   // logo cerulean
  logoInk:  [20, 37, 82],     // logo lettering
  cobalt:   [37, 88, 146],    // office wall
  cobaltD:  [22, 54, 96],
  cobaltL:  [52, 110, 172],
  night:    [17, 33, 51],     // deepened --ink for the tension scene
  ink:      [35, 63, 82],     // --ink
  navy:     [44, 79, 102],    // --navy
  navyS:    [58, 101, 128],   // --navy-soft
  primary:  [43, 120, 156],   // --primary
  primaryL: [90, 175, 211],   // --primary-light
  onDark:   [158, 211, 234],  // --accent-on-dark
  soft:     [214, 236, 246],  // --primary-soft
  sky:      [234, 244, 249],  // --sky
  paper:    [247, 241, 235],  // --paper
  beige:    [239, 228, 218],  // --beige
  sand:     [226, 211, 196],  // shade of beige (stone, shadows on paper)
  pine:     [196, 160, 124],  // office floor, lit
  pineD:    [161, 128, 98],   // office floor, shade
  text:     [28, 28, 30],     // --text-dark
  muted:    [94, 104, 114],   // --text-muted
  white:    [255, 255, 255],
  leaf:     [52, 92, 94],     // blue-green, kept inside the navy family
  leafL:    [74, 121, 118],

const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a <= 0 ? 0 : a >= 1 ? 1 : a.toFixed(3)})`;

// ==================================================================== font
// A geometric monoline sans in the spirit of the site's Satoshi, built from
// centre-line skeletons: y up, baseline 0, cap height 100. The weight is the
// stroke width in font units, so one skeleton gives Light to Bold. Diagonal
// strokes overshoot and are clipped flat; acute joins bevel into flat apexes.
const FM = { CAP: 100, XH: 70, ASC: 104, DSC: -27, OV: 1.6 };
function arcPts(cx, cy, rx, ry, a0, a1) {
  const n = Math.max(3, Math.ceil(Math.abs(a1 - a0) / 5));
  const out = [];
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * D2R;
    out.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return out;
}
function join(...parts) {
  const out = [];
  for (const p of parts) for (const q of p) {
    const l = out[out.length - 1];
    if (!l || Math.abs(l[0] - q[0]) > 1e-4 || Math.abs(l[1] - q[1]) > 1e-4) out.push(q);
  }
  return out;
}
const seg = (x0, y0, x1, y1) => [[x0, y0], [x1, y1]];
function extPt(a, b, e) { const dx = a[0] - b[0], dy = a[1] - b[1], L = Math.hypot(dx, dy); return [a[0] + dx / L * e, a[1] + dy / L * e]; }

  const ryu = (top - ym) / 2, ryl = (ym - bot) / 2;
  return join(arcPts(cx, ym + ryu, rxu, ryu, a0, 270), arcPts(cx, ym - ryl, rxl, ryl, 90, a1));
}
// arch of n/h/m: right leg up from the baseline, over the top, into the left stem
function arch(x0, x1, h, top) {
  const cx = (x0 + x1) / 2, rx = (x1 - x0) / 2, ry = Math.min(rx * 1.04, top + FM.OV - h - 20), cy = top + FM.OV - h - ry;
  return join(seg(x1, 0, x1, cy), arcPts(cx, cy, rx, ry, 0, 180));
}
const G = (() => {
  const { CAP, XH, ASC, DSC, OV } = FM, g = {};
  const dotR = h => h * 1.22;
  const bowl = (xl, xr, h) => { const rx = (xr - xl) / 2; return arcPts(xl + rx, 35, rx, 35 + OV - h, 0, 360); };
  // ------------------------------------------------------------ capitals
  g.A = h => { const ya = CAP - 0.25 * h, xl = 3 + 1.05 * h, xr = 73 - 1.05 * h, yb = 30, t = (ya - yb) / ya;
    return { w: 76, s: [xpoly([[xl, 0], [38, ya], [xr, 0]], 12), seg(38 + (xl - 38) * t, yb, 38 + (xr - 38) * t, yb)], clip: [0, CAP + 6], ml: 1.5 }; };
  g.B = h => { const x0 = 8 + h, ym = 55, ru = (CAP - h - ym) / 2, rl = (ym - h) / 2, xu = Math.max(x0, 56 - h - ru), xl = Math.max(x0, 62 - h - rl);
    return { w: 68, s: [seg(x0, 0, x0, CAP), join(seg(x0, CAP - h, xu, CAP - h), arcPts(xu, ym + ru, ru, ru, 90, -90), seg(xu, ym, x0, ym)),
      join(seg(x0, ym, xl, ym), arcPts(xl, h + rl, rl, rl, 90, -90), seg(xl, h, x0, h))] }; };
  g.C = h => ({ w: 86, s: [arcPts(47, 50, 43 - h, 50 + OV - h, 44, 316)] });
  g.D = h => { const x0 = 8 + h, xd = 34, rx = 82 - h - xd, ry = 50 - h;
    return { w: 88, s: [seg(x0, 0, x0, CAP), join(seg(x0, CAP - h, xd, CAP - h), arcPts(xd, 50, rx, ry, 90, -90), seg(xd, h, x0, h))] }; };
  g.E = h => { const x0 = 8 + h; return { w: 63, s: [seg(x0, 0, x0, CAP), seg(x0, CAP - h, 57, CAP - h), seg(x0, 51, 52, 51), seg(x0, h, 58, h)] }; };
  g.F = h => { const x0 = 8 + h; return { w: 59, s: [seg(x0, 0, x0, CAP), seg(x0, CAP - h, 55, CAP - h), seg(x0, 49, 51, 49)] }; };
  g.G = h => { const cx = 48, rx = 44 - h, ry = 50 + OV - h;
    return { w: 96, s: [join(arcPts(cx, 50, rx, ry, 42, 360), seg(cx + rx, 50, cx + 8, 50))] }; };
  g.H = h => { const x0 = 8 + h, x1 = 71 - h; return { w: 79, s: [seg(x0, 0, x0, CAP), seg(x1, 0, x1, CAP), seg(x0, 52, x1, 52)] }; };
  g.I = h => ({ w: 16 + 2 * h, s: [seg(8 + h, 0, 8 + h, CAP)] });

  g.K = h => { const x0 = 8 + h, A = [x0, 33], B = [74, CAP + 8], t = 0.42, lx = A[0] + (B[0] - A[0]) * t, ly = A[1] + (B[1] - A[1]) * t;
    return { w: 72, s: [seg(x0, 0, x0, CAP), [A, B], [[lx, ly], [74, -8]]], clip: [0, CAP] }; };
  g.L = h => { const x0 = 8 + h; return { w: 59, s: [seg(x0, 0, x0, CAP), seg(x0, h, 56, h)] }; };
  g.M = h => { const x0 = 8 + h, x1 = 90 - h; return { w: 98, s: [seg(x0, 0, x0, CAP), seg(x1, 0, x1, CAP), xpoly([[x0 + 0.15 * h, CAP], [49, 20], [x1 - 0.15 * h, CAP]], 14)], clip: [0, CAP], ml: 1.5 }; };
  g.N = h => { const x0 = 8 + h, x1 = 73 - h; return { w: 81, s: [seg(x0, 0, x0, CAP), seg(x1, 0, x1, CAP), xpoly([[x0 + 0.15 * h, CAP], [x1 - 0.15 * h, 0]], 14)], clip: [0, CAP] }; };

  g.W = h => ({ w: 108, s: [xpoly([[2 + 1.05 * h, CAP], [28, 0.25 * h], [54, CAP - 0.3 * h], [80, 0.25 * h], [106 - 1.05 * h, CAP]], 12)], clip: [0, CAP], ml: 1.5 });
  g.X = h => { const a = 3 + h, b = 70 - h; return { w: 73, s: [xpoly([[a, 0], [b, CAP]], 12), xpoly([[a, CAP], [b, 0]], 12)], clip: [0, CAP] }; };
  g.Y = h => { const yv = 44; return { w: 72, s: [xpoly([[2 + 1.05 * h, CAP], [36, yv], [70 - 1.05 * h, CAP]], 12), seg(36, 0, 36, yv)], clip: [0, CAP], ml: 1.5 }; };

  // ---------------------------------------------------------- lowercase

  g.b = h => { const x0 = 7 + h; return { w: 74, s: [seg(x0, 0, x0, ASC), bowl(x0, 69 - h, h)] }; };
  g.c = h => ({ w: 62, s: [arcPts(36, 35, 32 - h, 35 + OV - h, 48, 312)] });
  g.d = h => { const xs = 67 - h; return { w: 74, s: [bowl(5 + h, xs, h), seg(xs, 0, xs, ASC)] }; };
  g.e = h => { const cx = 36, rx = 32 - h, ry = 35 + OV - h; return { w: 71, s: [join(seg(cx - rx, 35, cx + rx, 35), arcPts(cx, 35, rx, ry, 0, 318))] }; };
  g.f = h => { const xs = 12 + h, r = 13, cy = ASC - h - r; return { w: 42, s: [join(seg(xs, 0, xs, cy), arcPts(xs + r, cy, r, r, 180, 58)), seg(2, XH - h, 36, XH - h)] }; };
  g.g = h => { const xs = 67 - h, yb = -1, r = 21; return { w: 74, s: [bowl(5 + h, xs, h), join(seg(xs, XH, xs, yb), arcPts(xs - r, yb, r, yb - DSC - h, 0, -158))] }; };

  g.q = h => { const xs = 67 - h; return { w: 74, s: [bowl(5 + h, xs, h), seg(xs, DSC, xs, XH)] }; };

  at(T.pull, (G, w) => whoosh(G, w, 1.2, 0.7, 200, 1800, 0.5, -0.5));
  at(T.pull + 0.3, (G, w) => rush(G, w, T.office + 0.5 - T.pull - 0.3, 0.9));
  [25.8, 26.25, 26.9, 27.35, 27.85, 28.3].forEach((tt, i) => at(tt, (G, w) => swift(G, w, 0.8, [-0.6, 0.5, -0.2, 0.7, -0.5, 0.3][i])));
  groove(26.4, 'G', { bright: 0.85, keys: true, shaker: true });
  T.stats.forEach((tt, i) => { for (let k = 0; k < 6; k++) at(tt + k * 0.06, (G, w) => tick(G, w, 0.5, 2600)); at(tt + 0.38, (G, w) => bell(G, w, [86, 90, 93][i], 0.6, (i - 1) * 0.4, 1)); });
  at(T.office, (G, w) => whoosh(G, w, 0.8, 0.5, 250, 1500, 0, 0));
  groove(28.8, 'Em', { half: true, clap: false, hat: false, keys: true, bright: 0.6, av: 0.7, beats: 2 });
  at(T.office + 0.85, (G, w) => { bell(G, w, 93, 0.5, 0.3, 1.8); bell(G, w + 0.22, 88, 0.5, 0.3, 2); });
  at(T.office + 0.9, (G, w) => whoosh(G, w, 0.4, 0.45, 500, 3000, -0.3, 0.3));
  groove(30.0, 'A', { half: true, clap: false, keys: false, bright: 0.6, av: 0.7, pad: false, beats: 2 });
  at(30.0, (G, w) => pad(G, w, CH.Asus.pad, 1.15, 1, 0.7));
  at(T.push, (G, w) => whoosh(G, w, 0.9, 0.6, 200, 4000, 0, 0));
  // ---------------------------------------------------------- E · the call to action
  at(T.cta, (G, w) => { pad(G, w, CH.G.pad, 2.35, 1, 0.5); sub(G, w, 31, 2.2, 0.8); whoosh(G, w, 0.5, 0.5, 400, 2000, 0, 0); });
  for (let i = 0; i < 4; i++) at(T.cta + i * b, (G, w) => kick(G, w, 0.55));
  for (let k = 0; k < 8; k++) { const m = CH.G.arp[k % 4]; at(T.cta + k * b / 2, (G, w) => pluck(G, w, m, 0.55, (k % 2) - 0.5, 0.15)); }
  for (let tt = T.cta + 0.35; tt < T.gratis - 0.05; tt += s16 * 0.5) { const k = (tt - T.cta) / (T.gratis - T.cta); at(tt, (G, w) => tick(G, w, 0.45 + 0.4 * k, 2200 + 900 * k)); }
  at(32.4, (G, w) => riser(G, w, 1.2, 0.8));
  for (let k = 0; k < 8; k++) at(33.0 + k * s16, (G, w) => snare(G, w, 0.25 + k * 0.08));
  at(T.gratis, (G, w) => { impact(G, w, 0.8); crash(G, w, 0.8); for (let i = 0; i < 6; i++) clack(G, w + i * 0.07, 0.7); [86, 90, 93, 98].forEach((m, i) => bell(G, w + 0.45 + i * 0.07, m, 0.7, (i - 1.5) * 0.3, 1.2)); sparkle(G, w + 0.45, 0.8, 0.8); });
  groove(T.gratis, 'A', { bright: 0.9, shaker: true, keys: true });
  at(T.senza, (G, w) => { thump(G, w, 0.6); blip(G, w, 86, 0.6); });
  at(T.tap, (G, w) => { click(G, w, 0.9, 1300); marimba(G, w + 0.02, 81, 0.7, 0.3); });
  for (let k = 0; k < 4; k++) at(35.4 + k * s16, (G, w) => snare(G, w, 0.4 + k * 0.12));
  at(T.logo, (G, w) => {
    impact(G, w, 0.9); crash(G, w, 0.9); kick(G, w, 1);
    pad(G, w, CH.D.pad.concat([74]), 3.2, 1.1, 0.8); sub(G, w, 38, 3.0, 0.9); bass(G, w, 38, 2.4, 0.8);
    CH.D.pad.forEach((m, j) => epiano(G, w + j * 0.02, m, 3.0, 0.8, (j - 1.5) * 0.3));
    motif(G, w, 1.1);
  });
  at(T.logo + 0.36, (G, w) => scratch(G, w, 0.7, 0.6));
  at(T.logo + 1.95, (G, w) => sparkle(G, w, 0.8, 0.6));
  at(38.4, (G, w) => bell(G, w, 93, 0.35, 0.3, 2.4));
  ev.sort((p, q) => p[0] - q[0]);
  return ev;
}

// ================================================================= player
// Browsers need a tap before they play sound, so the film opens on a poster.
// The picture follows the audio clock, which keeps it locked to the score.
// Tap to pause. "Scarica il video" records the film (1080 × 1920 + audio).
// ?t=12.5 freezes a frame for review.
const Q = new URLSearchParams(location.search);
const P = {
  state: Q.has('t') ? 'still' : 'poster', stillT: parseFloat(Q.get('t')) || 0,
  ac: null, G: null, T0: 0, perf0: 0, ev: null, idx: 0, timer: 0, endAt: 0,
  rec: null, fixedK: 0, ema: 16, lastF: 0, quality: 1, paused: false, poster: null, lastAdapt: 0,
};
const playBtn = document.getElementById('play');
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const cssW = Math.max(1, Math.floor(W * scale)), cssH = Math.max(1, Math.floor(H * scale));
  cvs.style.width = cssW + 'px';
  cvs.style.height = cssH + 'px';
  if (P.fixedK) { cvs.width = W; cvs.height = H; K = 1; }
  else {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const bw = Math.max(270, Math.min(W * 1.5, Math.round(cssW * dpr * P.quality)));
    cvs.width = bw; cvs.height = Math.round(bw * H / W); K = cvs.width / W;
  }
  P.poster = null;
}
function schedule() {
  if (!P.G) return;
  const ac = P.ac, ev = P.ev, horizon = ac.currentTime + 1.0;
  while (P.idx < ev.length && P.T0 + ev[P.idx][0] < horizon) {
    const [t, fn] = ev[P.idx++], w = P.T0 + t;
    if (w >= ac.currentTime - 0.02) { try { fn(P.G, Math.max(w, ac.currentTime + 0.005)); } catch (e) { /* one lost note never stops the film */ } }
  }
  if (P.idx < ev.length) P.timer = setTimeout(schedule, 60);
}
function stopAudio() {
  clearTimeout(P.timer);
  if (P.G) {
    const g = P.G;
    try { g.post.gain.setTargetAtTime(0, P.ac.currentTime, 0.03); } catch (e) { }
    setTimeout(() => { try { g.post.disconnect(); } catch (e) { } }, 250);
  }
  P.G = null;
}
function play(record) {
  stopAudio();
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!P.ac && AC) { try { P.ac = new AC({ latencyHint: 'playback' }); } catch (e) { try { P.ac = new AC(); } catch (e2) { P.ac = null; } } }
  P.paused = false;
  if (P.ac) {
    if (P.ac.state !== 'running') P.ac.resume();
    P.T0 = P.ac.currentTime + 0.18;
    P.G = audioGraph(P.ac, P.T0);
    P.ev = P.ev || buildScore();
    P.idx = 0;
    if (record) startRecording();
    schedule();
  } else P.perf0 = performance.now() + 180;
  P.state = 'playing';
  playBtn.textContent = 'Ricomincia il film';
}
function filmTime() {
  if (P.ac && P.G) return P.ac.currentTime - P.T0 - (P.rec ? 0 : (P.ac.outputLatency || 0));
  return (performance.now() - P.perf0) / 1000;
}
function startRecording() {
  if (!window.MediaRecorder || !cvs.captureStream || !P.ac.createMediaStreamDestination) return;
  P.fixedK = 1; resize();
  const dest = P.ac.createMediaStreamDestination();
  P.G.post.connect(dest);
  const stream = new MediaStream([...cvs.captureStream(60).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1.42E01F,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const type = types.find(x => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)) || '';
  let rec;
  try { rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 14e6, audioBitsPerSecond: 192e3 } : {}); } catch (e) { P.fixedK = 0; resize(); return; }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const mt = rec.mimeType || type || 'video/webm', blob = new Blob(chunks, { type: mt }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'casa-2-0-social-masterpiece.' + (mt.includes('mp4') ? 'mp4' : 'webm');
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    P.fixedK = 0; resize();
  };
  rec.start(500);
  P.rec = rec;
}
function stopRecording() { if (P.rec) { const r = P.rec; P.rec = null; setTimeout(() => { if (r.state !== 'inactive') r.stop(); }, 350); } }
// -------------------------------------------------------------- overlays
function drawPoster(c, now) {
  if (!P.poster) {
    POSTER = true; render(1.56); POSTER = false;
    P.poster = document.createElement('canvas'); P.poster.width = cvs.width; P.poster.height = cvs.height;
    P.poster.getContext('2d').drawImage(cvs, 0, 0);
  }
  c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(P.poster, 0, 0);
  c.setTransform(K, 0, 0, K, 0, 0);
  const g = c.createLinearGradient(0, 700, 0, H);
  g.addColorStop(0, 'rgba(8,20,36,0)'); g.addColorStop(1, 'rgba(8,20,36,0.62)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const pulse = 1 + 0.035 * Math.sin(now / 280);
  c.save(); c.translate(CX, 1480); c.scale(pulse, pulse);
  shadowed(c, 50, 20, 0.45, () => { c.fillStyle = 'rgba(255,255,255,0.96)'; c.beginPath(); c.arc(0, 0, 92, 0, TAU); c.fill(); }, [4, 12, 24]);
  c.fillStyle = rgba(C.cobalt); c.beginPath(); c.moveTo(-26, -40); c.lineTo(44, 0); c.lineTo(-26, 40); c.closePath(); c.fill();
  c.restore();
  drawText(c, 'Tocca per guardare · con audio', CX, 1640, { size: 34, w: 12, color: C.white });
  fillRR(c, CX - 250, 1716, 500, 80, 40, 'rgba(255,255,255,0.16)');
  drawText(c, 'Scarica il video 1080 x 1920', CX, 1768, { size: 25, w: 11, color: C.onDark });
}
function drawPaused(c) {
  c.setTransform(K, 0, 0, K, 0, 0);
  c.fillStyle = 'rgba(8,20,36,0.35)'; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,0.95)'; c.beginPath(); c.arc(CX, CY, 84, 0, TAU); c.fill();
  c.fillStyle = rgba(C.cobalt); c.fillRect(CX - 26, CY - 34, 18, 68); c.fillRect(CX + 8, CY - 34, 18, 68);
}
function drawReplay(c, u) {
  const a = clamp((u - 0.4) / 0.4);
  if (a <= 0) return;
  c.setTransform(K, 0, 0, K, 0, 0);
  c.save(); c.globalAlpha = a;
  fillRR(c, CX - 170, 1600, 340, 96, 48, 'rgba(255,255,255,0.16)');
  c.strokeStyle = rgba(C.white); c.lineWidth = 7; c.lineCap = 'round';
  c.beginPath(); c.arc(CX - 96, 1648, 22, -0.3, Math.PI * 1.45); c.stroke();
  c.fillStyle = rgba(C.white); c.beginPath(); c.moveTo(CX - 72, 1622); c.lineTo(CX - 70, 1646); c.lineTo(CX - 94, 1638); c.closePath(); c.fill();
  drawText(c, 'Rivedi', CX + 20, 1664, { size: 40, w: 13, color: C.white });
  c.restore();
}
// ----------------------------------------------------------------- input
function act(x, y) {
  if (P.state === 'still') return;
  if (P.state === 'poster') { play(y > 1700 && y < 1815 && Math.abs(x - CX) < 270); return; }
  if (P.state === 'ended') { play(false); return; }
  if (P.state === 'playing' && P.ac && !P.rec) {
    P.paused = !P.paused;
    if (P.paused) P.ac.suspend(); else P.ac.resume();
  }
}
cvs.addEventListener('click', e => { const r = cvs.getBoundingClientRect(); act((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); });
document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); act(CX, CY); } });
playBtn.addEventListener('click', e => { e.stopPropagation(); play(false); });
// ------------------------------------------------------------------ loop
// if frames run long, shed the costliest polish first, resolution last
function adapt(dt) {
  if (P.fixedK || dt <= 0 || dt > 250) return;
  P.ema = P.ema * 0.94 + dt * 0.06;
  const now = performance.now();
  if (P.ema > 24 && now - P.lastAdapt > 1200) {
    P.lastAdapt = now; P.ema = 17;
    if (FXQ.grain) FXQ.grain = 0;
    else if (FXQ.shadow) FXQ.shadow = 0;
    else if (FXQ.vignette) FXQ.vignette = 0;
    else if (P.quality > 0.55) { P.quality *= 0.85; resize(); }
  }
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - (P.lastF || now); P.lastF = now;
  if (P.state === 'poster') { drawPoster(ctx, now); return; }
  if (P.state === 'playing') {
    const t = filmTime();
    if (t >= DUR + 0.3) { P.state = 'ended'; P.endAt = now; stopRecording(); playBtn.textContent = 'Rivedi il film'; }
    else {
      if (!P.paused) { render(clamp(t, 0, DUR)); adapt(dt); }
      else { render(clamp(t, 0, DUR)); drawPaused(ctx); }
      return;
    }
  }
  if (P.state === 'ended') { render(DUR - 0.001); drawReplay(ctx, (now - P.endAt) / 1000); }
}
function dev() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (Q.has('specimen')) { specimen(ctx); return true; }
  if (Q.has('zoom')) { zoomSpec(ctx, Q.get('zoom')); return true; }
  if (Q.has('logotest')) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); drawLogo(ctx, 0, 0, 1080 / 276); drawLogo(ctx, 60, 700, 3, { roof: C.white, ink: C.white, under: 1 }); return true; }
  return false;
}
// review and export hooks (export-mp4.js renders every frame and the score through these)
window.__renderAt = t => { render(t); };
window.__fx = FXQ;
window.__dur = DUR;
// offline score: film time `from` lands AUDIO_LEAD seconds into the buffer
const AUDIO_LEAD = 0.05;
window.__audioLead = AUDIO_LEAD;
window.__renderAudio = async (from = 0, to = DUR, sr = 44100) => {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const len = to - from + 0.5, ac = new OAC(2, Math.ceil(sr * len), sr);
  const G = audioGraph(ac, AUDIO_LEAD - from), ev = buildScore().filter(e => e[0] >= from - 0.01 && e[0] < to);
  let i = 0;
  const feed = until => { while (i < ev.length && ev[i][0] - from + AUDIO_LEAD < until) { const [t, fn] = ev[i++]; fn(G, Math.max(ac.currentTime + 0.003, t - from + AUDIO_LEAD)); } };
  feed(1);
  for (let tt = 0.5; tt < len - 0.1; tt += 0.5) ac.suspend(tt).then(() => { feed(tt + 1); ac.resume(); });
  return ac.startRendering();
};
window.addEventListener('resize', () => { resize(); if (P.state === 'still') render(P.stillT); });
resize();
if (P.state === 'still') render(P.stillT);
else if (!dev()) requestAnimationFrame(loop);
})();
</script>
