<script>
(() => {
"use strict";

/* =====================================================================
   CASA 2.0 — "Building the Digital Home"
   35 s procedural film · Canvas 2D + Web Audio · zero external assets
   Palette from the Casa 2.0 site: navy-teal #326273 / #4A8FA3,
   navy #1A2A3C, ink #0E1116, paper #FAF7F4, coral #E8674F, red #C0392B
   ===================================================================== */

// ------------------------------------------------------------------ math
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
const E = {
  inQuad: t => t * t,
  inCubic: t => t * t * t,
  outCubic: t => 1 - (1 - t) ** 3,
  outQuart: t => 1 - (1 - t) ** 4,
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
};
// 0 before a · rises to 1 at b · holds · falls to 0 at d
const env = (t, a, b, c, d) => smooth(inv(a, b, t)) * (1 - smooth(inv(c, d, t)));

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (a, b = 0) => {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

// ---------------------------------------------------------------- colour
const COL = {
  ink:    [7, 9, 12],
  ink2:   [14, 17, 22],
  navy:   [26, 42, 60],
  teal:   [50, 98, 115],
  tealL:  [74, 143, 163],
  glow:   [126, 192, 214],   // luminous tint of the brand teal
  paper:  [250, 247, 244],
  coral:  [232, 103, 79],
  coralL: [255, 126, 107],
  red:    [192, 57, 43],
};
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a <= 0 ? 0 : a >= 1 ? 1 : a.toFixed(3)})`;
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// ---------------------------------------------------------------- canvas
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d', { alpha: false });
const layer = document.createElement('canvas');          // emissive scene layer (bloomed)
const lctx = layer.getContext('2d');
const bl = [0, 1].map(() => document.createElement('canvas'));      // bloom: 1/4 and 1/8 res
const blc = bl.map(c => c.getContext('2d'));
const HAS_FILTER = typeof blc[0].filter === 'string';
let W = 1, H = 1, DPR = 1, U = 1, CX = 0, CY = 0, DIAG = 1;

const DUR = 35.0;
const FONT_SANS = '"Helvetica Neue", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';
const FONT_MONO = 'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", "Liberation Mono", monospace';

// glow sprites (procedural radial gradients)
function makeSprite(col) {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgba(col, 1)); gr.addColorStop(0.16, rgba(col, 0.6));
  gr.addColorStop(0.42, rgba(col, 0.14)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return s;
}
const SPR = { glow: makeSprite(COL.glow), paper: makeSprite(COL.paper), coral: makeSprite(COL.coralL) };
const SPR_BY = [SPR.glow, SPR.coral, SPR.paper];
const COL_BY = [COL.glow, COL.coralL, COL.paper];
function glowAt(c, spr, x, y, r, a) {
  if (a <= 0.003 || r <= 0.3) return;
  c.globalAlpha = a > 1 ? 1 : a;
  c.drawImage(spr, x - r, y - r, r * 2, r * 2);
  c.globalAlpha = 1;
}

// film grain tile
const grainTile = document.createElement('canvas');
grainTile.width = grainTile.height = 128;
{
  const g = grainTile.getContext('2d'), id = g.createImageData(128, 128), r = rng(3);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = (128 + (r() - 0.5) * 230) | 0;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
}
let grainPat = null;

// letter-spaced text (returns width)
function track(c, s, x, y, sp, align) {
  let w = 0;
  for (const ch of s) w += c.measureText(ch).width + sp;
  w -= sp;
  let px = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  for (const ch of s) { c.fillText(ch, px, y); px += c.measureText(ch).width + sp; }
  return w;
}
function trackWidth(c, s, sp) { let w = 0; for (const ch of s) w += c.measureText(ch).width + sp; return w - sp; }

// =====================================================================
//  SCENE DATA — everything is a pure function of film time t
// =====================================================================

// ------------------------------------------------ blueprint grid (0–5 s)
const N = 12;                                   // grid spans -N..N world units
const LINE_T0 = 0.35, LINE_STEP = 0.12, LINE_DUR = 1.7;
const lineStart = k => LINE_T0 + Math.abs(k) * LINE_STEP;
const reachTime = (k, d) => lineStart(k) + (1 - Math.cbrt(Math.max(0, 1 - d / N))) * LINE_DUR;
const nodes = [];
{
  const r = rng(7);
  for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
    // a node lights when both of its lines have been drawn through it
    const tl = Math.max(reachTime(j, Math.abs(i)), reachTime(i, Math.abs(j))) + r() * 0.12;
    const major = i % 4 === 0 && j % 4 === 0;
    nodes.push({ i, j, tl, major, active: (i === 0 && j === 0) || r() < 0.16, ph: r() * TAU });
  }
}

// --------------------------------------------- blocks: plan → ecosystem
// plan:  [x0, z0, w, d, h] on the grid        (the "strategic plan")
// eco:   [x, yBottom, z, w, h, d, rot]         (the floating ecosystem)
// tier:  0 base ring · 1 cross · 2 crown       accent: 0 teal · 1 coral · 2 paper
const BLOCKS = [
  // the plan's central 2×2 becomes the heart of the stack; the rest become an exploded axonometric
  ['N',  [-1, -1, 2, 2, 3.2], [0, 2.46, 0, 1.0, 1.0, 1.0, 0], 1, 1],          // core
  ['A',  [ 1, -1, 2, 1, 1.2], [1.0, 0.84, -0.4, 0.8, 0.9, 2.0, 0], 0, 1],     // pinwheel
  ['B',  [-1,  1, 1, 2, 1.8], [-1.0, 0.84, 0.4, 0.8, 0.9, 2.0, 0], 0, 0],
  ['C',  [-3,  0, 2, 1, 1.0], [-0.4, 0.84, -1.0, 2.0, 0.6, 0.8, 0], 0, 0],
  ['D',  [ 0, -3, 1, 2, 2.2], [0.4, 0.84, 1.0, 2.0, 0.6, 0.8, 0], 0, 0],
  ['c1', [ 2,  1, 1, 1, 0.6], [2.2, 1.5, 2.0, 0.42, 0.42, 0.42, 0.5], 0, 2],  // satellites
  ['c2', [-3, -2, 1, 1, 1.4], [-2.2, 2.1, -1.9, 0.38, 0.38, 0.38, 0.9], 0, 1],
  ['E',  [-4,  2, 3, 1, 0.5], [0, 0.7, 0, 3.6, 0.14, 3.6, 0], 0, 0],          // ground slab
  ['F',  [ 1,  1, 1, 3, 0.8], [0, 4.05, 0, 0.5, 0.28, 3.3, 0], 1, 1],         // cross bars
  ['G',  [ 3, -2, 1, 1, 2.0], [0.95, 2.46, 0.95, 0.5, 0.5, 0.5, 0], 1, 0],
  ['H',  [-2, -4, 1, 1, 1.6], [-0.95, 2.46, -0.95, 0.5, 0.75, 0.5, 0], 1, 0],
  ['I',  [ 2, -4, 1, 1, 0.9], [0.9, 6.3, -0.7, 0.34, 0.34, 0.34, 0.6], 2, 2],
  ['J',  [ 1, -3, 2, 1, 0.4], [0, 2.34, 0, 2.6, 0.12, 2.6, 0], 1, 0],         // mid slab
  ['K',  [ 0,  3, 1, 1, 2.6], [0, 5.14, 0, 0.36, 1.7, 0.36, 0.785], 2, 2],   // spire
  ['L',  [-4, -1, 1, 1, 0.7], [0, 5.02, 0, 1.5, 0.12, 1.5, 0.785], 2, 0],    // crown slab
  ['M',  [ 3,  0, 1, 1, 1.1], [0, 3.75, 0, 3.3, 0.28, 0.5, 0], 1, 0],
];
const blocks = BLOCKS.map(([id, p, e, tier, acc], i) => ({
  id, i, tier, acc,
  px: p[0] + p[2] / 2, pz: p[1] + p[3] / 2, pw: p[2], pd: p[3], ph: p[4],
  ex: e[0], ey: e[1], ez: e[2], ew: e[3], eh: e[4], ed: e[5], er: e[6],
  ord: 0, ord2: 0, bob: hash(i, 3) * TAU, hatch: hash(i, 5) < 0.5,
  st: { x: 0, y: 0, z: 0, w: 0, h: 0, d: 0, r: 0 }, depth: 0,
}));
[...blocks].sort((a, b) => Math.hypot(a.px, a.pz) - Math.hypot(b.px, b.pz)).forEach((b, k) => (b.ord = k));
[...blocks].sort((a, b) => a.tier - b.tier || a.ord - b.ord).forEach((b, k) => (b.ord2 = k));
const TIER_SPIN = [0.14, -0.2, 0.28];
const ECO_CY = 3.7;                              // centre of the floating structure
const planStart = b => 2.3 + b.ord * 0.11;
const extrudeStart = b => 7.9 + b.ord * 0.17;
const traceStart = b => extrudeStart(b) - 0.85;
const reorgStart = b => 12.0 + b.ord2 * 0.075;
const REORG_DUR = 2.4;
const condense = t => E.inCubic(inv(20.3, 27.85, t));
const spinAngle = t => { const u = inv(20.0, 27.85, t); return 9.0 * 7.85 * u ** 4 / 4; };   // ω: 0 → 9 rad/s

function blockState(b, t, o) {
  const ex = E.outQuart(inv(extrudeStart(b), extrudeStart(b) + 1.1, t));
  let x = b.px, y = 0, z = b.pz, w = b.pw, h = Math.max(0.001, b.ph * ex), d = b.pd, r = 0;
  const ru = inv(reorgStart(b), reorgStart(b) + REORG_DUR, t);
  if (ru > 0) {                                  // lift into the floating ecosystem
    const ta = TIER_SPIN[b.tier] * Math.max(0, t - 12.0);
    const ca = Math.cos(ta), sa = Math.sin(ta);
    const tx = b.ex * ca - b.ez * sa, tz = b.ex * sa + b.ez * ca;
    const ty = b.ey + 0.1 * Math.sin(t * 1.15 + b.bob) * smooth(inv(12.5, 15.5, t));
    const m = E.inOutCubic(ru), my = E.outCubic(clamp(ru * 1.3));
    x = lerp(x, tx, m); z = lerp(z, tz, m); y = lerp(0, ty, my);
    w = lerp(w, b.ew, m); h = lerp(h, b.eh, m); d = lerp(d, b.ed, m);
    r = lerp(0, b.er + ta, m);
  }
  if (t > 20.0) {                                // launch: spin + condense into the core
    const c = condense(t), sp = spinAngle(t), cs = Math.cos(sp), sn = Math.sin(sp);
    const f = 1 - 0.95 * c, rx = x * f, rz = z * f;
    const ny = ECO_CY + (y + h / 2 - ECO_CY) * f;
    x = rx * cs - rz * sn; z = rx * sn + rz * cs;
    const sf = 1 - 0.88 * c;
    w *= sf; h *= sf; d *= sf;
    y = ny - h / 2; r += sp;
  }

  return o;
}

// ------------------------------------------------ orbitals (UI / UX)
const RINGS = [
  { R: 3.5, ax: 0.38, az: 0.12, w: 0.52, n: 6 },
  { R: 4.3, ax: -0.24, az: 0.40, w: -0.36, n: 8 },
  { R: 3.0, ax: 0.98, az: -0.22, w: 0.70, n: 5 },
  { R: 4.9, ax: 0.10, az: -0.14, w: 0.24, n: 9 },
  { R: 3.3, ax: -1.08, az: 0.58, w: -0.58, n: 4 },
].map((g, k) => ({
  ...g, cx: Math.cos(g.ax), sx: Math.sin(g.ax), cz: Math.cos(g.az), sz: Math.sin(g.az),
  parts: Array.from({ length: g.n }, (_, i) => ({
    th: (i / g.n) * TAU + hash(k, i) * 0.5,
    type: Math.floor(hash(i, k + 9) * 4),
    size: 0.8 + hash(k + 3, i) * 0.6,
    ph: hash(k + 5, i) * TAU,
  })),
}));
const ringAngle = (g, t) => { const u = inv(20.0, 27.85, t); return g.w * Math.max(0, t - 12) + g.w * 10 * 7.85 * u ** 4 / 4; };
const ringRadius = (g, t) => g.R * (1 - 0.93 * condense(t)) * lerp(1.3, 1, E.outCubic(inv(12.6, 15.6, t)));
function ringPoint(g, R, th, o) {
  const x = R * Math.cos(th), z0 = R * Math.sin(th);
  const y1 = -z0 * g.sx, z1 = z0 * g.cx;
  o.x = x * g.cz - y1 * g.sz; o.y = ECO_CY + x * g.sz + y1 * g.cz; o.z = z1;
  return o;
}
// user interactions: beams from orbiting UI elements to the structure
const BEAMS = [];
{
  const r = rng(31);
  for (let t = 15.0; t < 20.2; t += 0.3 + r() * 0.32)
    BEAMS.push({ t, g: Math.floor(r() * RINGS.length), p: r(), b: Math.floor(r() * blocks.length), col: r() < 0.5 ? 1 : 0 });
}

// ------------------------------------------------ launch: inflow + burst
const INFLOW = [];
{
  const r = rng(57);
  for (let i = 0; i < 280; i++) {
    const u = Math.pow(r(), 0.55);
    const ts = 20.4 + u * 7.1;
    let dur = lerp(1.35, 0.5, u) * (0.8 + r() * 0.4);
    if (ts + dur > 27.85) dur = Math.max(0.2, 27.85 - ts);
    INFLOW.push({ ts, dur, a: r() * TAU, R0: 0.5 + r() * 0.35, col: r() < 0.6 ? 0 : r() < 0.6 ? 1 : 2, w: 0.6 + r() * 1.2 });
  }
}
const BOOM = 28.0;
const BURST = [];
{
  const r = rng(99);
  for (let i = 0; i < 1800; i++) {
    const dust = i < 1150;
    const a = r() * TAU;
    BURST.push({
      dust, a, ca: Math.cos(a), sa: Math.sin(a),
      rf: dust ? 0.05 + Math.pow(r(), 0.8) * 0.37 : 0.48 + r() * 0.5,
      dur: dust ? 1.0 + r() * 0.8 : 0.9 + r() * 0.7,
      col: r() < 0.5 ? 0 : r() < 0.55 ? 1 : 2,
      flat: r() < 0.5 ? 0.62 + r() * 0.3 : 1,
      size: 0.6 + r() * 1.4, dx: r() - 0.5, dy: r() - 0.5, ph: r() * TAU, tw: 0.6 + r() * 2.2,
      tgt: -1,
    });
  }
}
function burstPos(p, t, o) {
  const T = Math.max(0, t - BOOM), u = clamp(T / p.dur), e = 1 - (1 - u) ** 4;
  const R = p.rf * DIAG * e, drift = U * 0.014 * T, wob = U * 0.004 * clamp(T);
  o.x = CX + p.ca * R + p.dx * drift + Math.sin(t * 0.9 + p.ph) * wob;
  o.y = CY + p.sa * R * p.flat + p.dy * drift + Math.cos(t * 0.7 + p.ph) * wob;
  o.v = p.rf * DIAG * 4 * (1 - u) ** 3 / p.dur;
  return o;
}

// =====================================================================
//  CODE-DRAWN TYPE — a geometric monoline face built from lines + arcs
//  units: cap height = 1, y up · segments: ['L',x0,y0,x1,y1] | ['E',cx,cy,rx,ry,a0°,a1°]
// =====================================================================
const GLYPH = {
  C: { w: 0.92, s: [[['E', 0.46, 0.5, 0.46, 0.5, 44, 316]]], g: [[0.46, 0.5, 0.46, 0.5]] },
  A: { w: 0.92, s: [[['L', -0.0286, -0.06, 0.46, 0.965], ['L', 0.46, 0.965, 0.9486, -0.06]], [['L', 0.1478, 0.31, 0.7722, 0.31]]], g: [] },
  S: { w: 0.64, s: [[['E', 0.32, 0.76, 0.29, 0.24, 18, 270], ['E', 0.32, 0.26, 0.32, 0.26, 90, -160]]], g: [[0.32, 0.76, 0.29, 0.24], [0.32, 0.26, 0.32, 0.26]] },
  '.': { w: 0.12, dot: [0.06, 0.05] },
  '0': { w: 0.62, s: [[['E', 0.31, 0.5, 0.31, 0.5, 90, 450]]], g: [[0.31, 0.5, 0.31, 0.5]], closed: true },

{ // "2": top bowl + a diagonal that leaves the bowl exactly on its tangent
  const cx = 0.30, cy = 0.715, r = 0.285, bx = 0, by = 0;
  const base = Math.atan2(cy - by, cx - bx), off = Math.asin(r / Math.hypot(cx - bx, cy - by));

  const tx = cx + r * Math.cos(aT), ty = cy + r * Math.sin(aT);

}
const TRACK = 0.16, SPACE = 0.42, KERN = { '2.': 0.1, '.0': 0.1 };

// polyline (px, y down) from segments
function buildStroke(segs, S, ox, closed) {
  const pts = [];
  const push = (x, y) => {
    const px = ox + x * S, py = -y * S, n = pts.length;
    if (n && Math.abs(pts[n - 2] - px) < 0.01 && Math.abs(pts[n - 1] - py) < 0.01) return;
    pts.push(px, py);

  for (const sg of segs) {
    if (sg[0] === 'L') { push(sg[1], sg[2]); push(sg[3], sg[4]); continue; }

    const span = Math.abs(a1 - a0) * D2R, n = Math.max(8, Math.ceil(span * Math.max(rx, ry) * S / 1.6));
    for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * (i / n)) * D2R; push(cx + rx * Math.cos(a), cy + ry * Math.sin(a)); }

  return { pts: P, cum, len: cum[cnt - 1], closed: !!closed };
}
function strokeAt(st, d, o) {                      // point at arclength d
  const c = st.cum, p = st.pts;
  if (d <= 0) { o.x = p[0]; o.y = p[1]; return o; }
  let lo = 0, hi = c.length - 1;
  if (d >= c[hi]) { o.x = p[2 * hi]; o.y = p[2 * hi + 1]; return o; }
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] < d) lo = m; else hi = m; }
  const f = (d - c[lo]) / (c[hi] - c[lo] || 1);
  o.x = lerp(p[2 * lo], p[2 * hi], f); o.y = lerp(p[2 * lo + 1], p[2 * hi + 1], f);
  return o;
}

  const p = st.pts, cum = st.cum;
  c.moveTo(ox + p[0], oy + p[1]);
  for (let i = 1; i < cum.length; i++) {
    if (cum[i] <= len) { c.lineTo(ox + p[2 * i], oy + p[2 * i + 1]); continue; }
    const f = (len - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
    c.lineTo(ox + lerp(p[2 * i - 2], p[2 * i], f), oy + lerp(p[2 * i - 1], p[2 * i + 1], f));

// =====================================================================
//  START OVERLAY + END CARD (procedural)
// =====================================================================
const APP = { mode: 'intro', p0: 0, startMs: 0, endMs: 0, debugT: 0, mx: -1, my: -1, pill: null, lastNow: 0, ema: 0, lastDrop: 0 };

let introWord = null, introS = 0;
