# Cloudflare Pages — Casa 2.0
# Il sito è statico (cartella radice). Le API dei form stanno in /functions,
# i dati nel database D1 "casa2-leads".
name = "casa2"
pages_build_output_dir = "."
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "casa2-leads"
database_id = "INSERISCI-QUI-L-ID-DEL-DATABASE"   # lo stampa: npx wrangler d1 create casa2-leads

# Variabili NON segrete (quelle segrete vanno messe con: npx wrangler pages secret put NOME)
[vars]
LEAD_TO = "info@casaduepuntozero.net"
